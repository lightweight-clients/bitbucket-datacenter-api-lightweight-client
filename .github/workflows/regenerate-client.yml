name: Regenerate client

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  schema_url: https://raw.githubusercontent.com/lightweight-clients/schemas/refs/heads/master/schemas/bitbucket-datacenter-api-9.4/openapi.json

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: client
      - uses: actions/checkout@v6
        with:
          repository: lightweight-clients/bitbucket-datacenter-api-lightweight-client-generator
          path: generator
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Generate client
        working-directory: generator
        run: npm ci && npm start
      - name: Update generated source
        run: cp -R generator/output/. client/src/
      - name: Format generated source
        working-directory: client
        run: npm run lint:fix
      - name: Record schema revision and patch version
        working-directory: client
        run: |
          schema_version=$(curl -fsSL "$schema_url" | sha256sum | cut -d ' ' -f1)
          npm version patch --no-git-tag-version
          jq --arg schema_version "$schema_version" '.schema_version = $schema_version' package.json > package.json.tmp
          mv package.json.tmp package.json
      - uses: peter-evans/create-pull-request@v7
        with:
          path: client
          branch: regenerate-client
          commit-message: 'chore: regenerate client'
          title: Regenerate client
